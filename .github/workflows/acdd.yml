name: Strict ACDD
on:
  pull_request:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify one file per commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/audit-commits.py "$BASE_SHA"
